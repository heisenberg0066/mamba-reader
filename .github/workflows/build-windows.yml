name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Node + MuPDF worker)
        run: |
          node test/run-tests.js
          node test/edit-tests.js

      - name: Build installer, portable and zip
        run: npx electron-builder --win --x64 --publish never

      - name: Self-test of the packaged app (--self-test)
        shell: pwsh
        run: |
          $env:MAMBA_READER_DATA = "$env:RUNNER_TEMP\mr-selftest"
          $env:MAMBA_READER_REPORT = "$env:RUNNER_TEMP\selftest-report.txt"
          $p = Start-Process -FilePath "dist\win-unpacked\Mamba Reader.exe" -ArgumentList '--self-test' -PassThru -Wait
          Get-Content $env:MAMBA_READER_REPORT
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: UI test of the packaged app (screenshots)
        shell: pwsh
        run: |
          $env:MAMBA_READER_DATA = "$env:RUNNER_TEMP\mr-selftest"
          $env:MAMBA_READER_NO_LOCK = '1'
          $env:MAMBA_READER_UITEST = "$PWD\test\ui.js"
          $env:MAMBA_READER_SHOTS = "$PWD\shots"
          $env:MAMBA_READER_REPORT = "$env:RUNNER_TEMP\ui-report.txt"
          $p = Start-Process -FilePath "dist\win-unpacked\Mamba Reader.exe" -PassThru -Wait
          Get-Content $env:MAMBA_READER_REPORT
          if ($p.ExitCode -ne 0) { throw "UI test failed ($($p.ExitCode))" }

      - name: PDF editor UI test of the packaged app (real input events, saved PDF verified)
        shell: pwsh
        run: |
          $fx = "$env:RUNNER_TEMP\edit-fixtures"
          node test/edit-fixture.js $fx
          $env:MAMBA_READER_DATA = "$env:RUNNER_TEMP\mr-edittest"
          $env:MAMBA_READER_NO_LOCK = '1'
          $env:MAMBA_READER_FIXTURES = $fx
          $env:MAMBA_READER_UITEST = "$PWD\test\ui-edit.js"
          $env:MAMBA_READER_SHOTS = "$PWD\shots"
          $env:MAMBA_READER_REPORT = "$env:RUNNER_TEMP\ui-edit-report.txt"
          $p = Start-Process -FilePath "dist\win-unpacked\Mamba Reader.exe" -PassThru
          if (!$p.WaitForExit(240000)) { $p.Kill(); throw 'editor UI test timed out' }
          Get-Content $env:MAMBA_READER_REPORT
          if ($p.ExitCode -ne 0) { throw "editor UI test failed ($($p.ExitCode))" }
          Get-ChildItem $fx

      - name: Install silently, verify path, registry and handoff end to end
        shell: pwsh
        run: |
          Get-Process 'Mamba Reader' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          $setup = Get-ChildItem dist\MambaReader-Setup-*.exe | Select-Object -First 1
          $exe = "$env:LOCALAPPDATA\Programs\Mamba Reader\Mamba Reader.exe"
          for ($try = 1; $try -le 4 -and !(Test-Path $exe); $try++) {
            $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
            Write-Host "Setup exit code: $($p.ExitCode) (attempt $try)"
            for ($i = 0; $i -lt 60 -and !(Test-Path $exe); $i++) { Start-Sleep 1 }
          }
          if (!(Test-Path $exe)) { throw "not installed at $exe" }
          Write-Host "Installed: $exe"
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\mamba-reader\shell\open\command').'(default)'
          Write-Host "mamba-reader:// command: $cmd"
          if ($cmd -notlike "*Mamba Reader.exe*") { throw 'protocol not registered' }
          $owp = Get-ItemProperty 'HKCU:\Software\Classes\.pdf\OpenWithProgids'
          if (-not ($owp.PSObject.Properties.Name -contains 'MambaReader.Book')) { throw '.pdf Open-with entry missing' }

          $log = "$env:APPDATA\Mamba Reader\handoff.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $pdf = (Resolve-Path test\fixtures\handoff-test.pdf).Path
          # 1) file path argument (what Mamba Convert does when it finds the exe)
          Start-Process -FilePath $exe -ArgumentList "`"$pdf`""
          $ok = $false; for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; if ((Test-Path $log) -and (Select-String -Path $log -Pattern '"event":"opened".*"source":"argv"' -Quiet)) { $ok = $true; break } }
          if (Test-Path $log) { Get-Content $log }
          if (!$ok) { throw 'argv handoff failed' }
          # 2) mamba-reader:// protocol through the Windows shell, delivered to the running instance
          $url = 'mamba-reader://open?path=' + [uri]::EscapeDataString($pdf) + '&page=3'
          Start-Process $url
          $ok = $false; for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; if (Select-String -Path $log -Pattern '"event":"opened".*"source":"protocol"' -Quiet) { $ok = $true; break } }
          Get-Content $log
          if (!$ok) { throw 'protocol handoff failed' }
          # 3) edit mode, as Mamba Convert's "Edit PDF" launches it: --edit <file>, then mamba-reader://edit?path=
          Start-Process -FilePath $exe -ArgumentList "--edit `"$pdf`""
          $ok = $false; for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; if (Select-String -Path $log -Pattern '"event":"opened".*"source":"argv".*"mode":"edit"' -Quiet) { $ok = $true; break } }
          if (!$ok) { Get-Content $log; throw '--edit handoff failed' }
          Start-Process ('mamba-reader://edit?path=' + [uri]::EscapeDataString($pdf))
          $ok = $false; for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; if (Select-String -Path $log -Pattern '"event":"opened".*"source":"protocol".*"mode":"edit"' -Quiet) { $ok = $true; break } }
          Get-Content $log
          if (!$ok) { throw 'mamba-reader://edit handoff failed' }
          $procs = @(Get-Process 'Mamba Reader' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })
          Write-Host "Visible Mamba Reader windows: $($procs.Count) (single instance expected)"
          if ($procs.Count -gt 1) { throw 'second instance was not forwarded' }
          Get-Process 'Mamba Reader' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2

      - name: Uninstall silently and verify registry cleanup
        shell: pwsh
        run: |
          $un = "$env:LOCALAPPDATA\Programs\Mamba Reader\Uninstall Mamba Reader.exe"
          Start-Process -FilePath $un -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path 'HKCU:\Software\Classes\mamba-reader'); $i++) { Start-Sleep 1 }
          if (Test-Path 'HKCU:\Software\Classes\mamba-reader') { throw 'protocol key left behind' }
          if (Test-Path 'HKCU:\Software\Classes\MambaReader.Book') { throw 'ProgID left behind' }
          Write-Host 'Uninstall removed the registry entries.'

      - uses: actions/upload-artifact@v4
        with:
          name: mamba-reader-windows
          path: |
            dist/MambaReader-Setup-*.exe
            dist/MambaReader-Portable-*.exe
            dist/MambaReader-*-win-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: shots/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Mamba Reader ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/MambaReader-Setup-*.exe
            dist/MambaReader-Portable-*.exe
            dist/MambaReader-*-win-x64.zip
